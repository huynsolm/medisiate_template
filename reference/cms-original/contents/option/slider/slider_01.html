<!-- cms common script -->
<style>
    /* main page top keyvisual */
    .keyvisual-banner {height:620px;}
    .keyvisual-banner .slick-list,
    .keyvisual-banner .slick-track {height:100%;}
    .keyvisual-banner .slick-dots {position:absolute;left:50%;bottom:30px;list-style-type:none;padding:0;margin:0 0 0 53px;transform:translateX(-50%)}
    .keyvisual-banner .slick-dots li {display:inline-block;margin-left:9px;}
    .keyvisual-banner .slick-dots li:first-child {margin-left:0;}
    .keyvisual-banner .slick-dots button {width:16px;height:16px;padding:0;border:3px solid #cdcdcd;border-radius:50%;background:transparent;text-indent:-9999em;}
    .keyvisual-banner .slick-dots .slick-active button {background:#cdcdcd;}
    .keyvisual-banner .slick-slide,
    .keyvisual-banner .slick-dots button {outline:none;}
    .keyvisual-banner .item {overflow:hidden;position:relative;height:100%;background-size:cover;background-position:50% 50%;}
    .keyvisual-banner .item .float-box {position:absolute;width:85%;min-width:950px;max-width:1063px;height:100%;left:50%;top:0;transform:translateX(-50%);}
    .keyvisual-banner .top-box {background:url(http://www.nowonsol.co.kr/Resources/images/main/visual_top_bg.png) no-repeat;background-size:cover;overflow:hidden;position:relative;height:90px;}
    .keyvisual-banner .top-text {overflow:hidden;position:absolute;left:50%;top:10px;transform:translateX(-50%);}
    .keyvisual-banner .top-text div {float:left;margin-left:100px}
    .keyvisual-banner .top-text div:nth-child(1) {margin-left:0px}
    .keyvisual-banner .visual {position:absolute;right:0;top:50%;transform:translateY(-50%);}
    .keyvisual-banner .slogan {position:absolute;left:0;top:50%;transform:translateY(-50%);color:#fff;}
    .keyvisual-banner .slogan .eyebrow {font-weight:700;font-size:2rem;line-height:2.125rem;text-align:center}
    .keyvisual-banner .slogan .tit {font-weight:100;font-size:4.375rem;line-height:4.625rem;letter-spacing:-0.065em;text-align:center}
    .keyvisual-banner .slogan .copy {font-weight:500;font-size:3.188rem;line-height:4.188rem;color:#ffefae;background:#f38a01;display:inline-block;margin:40px 0 0 0;padding:0 15px;-webkit-border-radius:10px;-moz-border-radius:10px;border-radius:10px;}
    .keyvisual-banner .slogan strong {font-weight:500;}
    .keyvisual-banner .slogan em {font-style:normal;color:#ffec86;}
    @media (max-width: 1400px) {
        .keyvisual-banner .top-text {left:5%;}
        .keyvisual-banner .top-text div {margin-left:50px}
        .keyvisual-banner .slick-dots {margin-left:95px;}
        .keyvisual-banner .slogan .tit {font-size:3.438rem;line-height:3.75rem;}
        .keyvisual-banner .slogan .copy {font-size:4rem;}
    }
    @media (max-width: 1200px) {
        .keyvisual-banner .slick-dots {margin-left:0;left:57.5%;}
        .keyvisual-banner .top-text {left:3%;}
    }
    @media (max-width: 991px) {
        .keyvisual-banner {height:auto;}
        .keyvisual-banner .slick-dots {left:30px;bottom:18.647%;transform:translateX(0);font-size:0}
        .keyvisual-banner .slick-dots button {width:10px;height:10px;border-width:2px;}
        .keyvisual-banner .item .visual-bg {width:100%;margin:51px 0 0 0}
        .keyvisual-banner .item .float-box {width:100%;min-width:0;}
        .keyvisual-banner .slogan {width:100%;left:50%;top:23%;transform:translateX(-50%);text-align:center;}
        .keyvisual-banner .slogan .eyebrow {margin:0;padding:0;font-size:1.25rem;line-height:1.625rem;}
        .keyvisual-banner .slogan .tit {margin-bottom:0;font-size:2.313rem;line-height:2.5rem;}
        .keyvisual-banner .slogan .copy {font-size:1.625rem;line-height:2.125rem;padding:0 10px;margin:0.938rem 0 0 0;}
        .keyvisual-banner .slogan .copy em {display:block;}
        .keyvisual-banner .slogan .img-bottom {max-width:30%;margin:7% auto 0}
        .keyvisual-banner .top-box {position:absolute;top:0;width:100%;height:51px;}
        .keyvisual-banner .slick-dots {left:50%;bottom:20px;}
        .keyvisual-banner .top-text {width:100%;top:50%;transform:translateY(-50%);color:#fff;line-height:1.125rem}
        .keyvisual-banner .top-text .top-lt-text2 {margin-left:0;}
        .keyvisual-banner .top-text .top-lt-text1 .text-color {color:#ffd563;display:block;}
        .keyvisual-banner .top-text .top-lt-text2 .text-color {color:#f9b468;display:block;}
        .keyvisual-banner .top-text .top-lt-text1:before {content:"";display:block;background:url(http://www.nowonsol.co.kr/Resources/images/main/visual_mainimg_02_m.png) no-repeat;background-size:100%;width:34px;height:34px;float:left;margin-right:5px;}
        .keyvisual-banner .top-text .top-lt-text2:before {content:"";display:block;background:url(http://www.nowonsol.co.kr/Resources/images/main/visual_mainimg_03_m.png) no-repeat;background-size:100%;width:34px;height:34px;float:left;margin-right:5px;}
    }
    @media (max-width: 400px) {
        .keyvisual-banner .top-box {font-size:0.875rem}
    }
    </style>
<script src="http://www.nowonsol.co.kr/Module/resources/js/slick.min.js"></script>
<script>

		// main keyvisual
        $('.main-carousel').slick({

            autoplay: true,
            autoplaySpeed: 4000
        });
	});
</script>
